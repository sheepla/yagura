[package]
name = "yagura"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A TUI file tree watcher for observing what a coding agent is doing"
readme = "README.md"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ignore = "0.4"
notify = "8"
nucleo = "0.5.0"
pulldown-cmark = "0.13.4"
ratatui = "0.30"
ratatui-textarea = "0.9.2"
serde_json = "1"
similar = "3"
slotmap = "1.1"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy", "dump-load"] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
insta = "1.48"
proptest = "1.11"
tempfile = "3.27"

[profile.release]
lto = "thin"
strip = true
