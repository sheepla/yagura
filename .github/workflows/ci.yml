name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: fmt, clippy and tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: The toolchain the runner has
        run: |
          rustc --version
          cargo --version
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  # Windows only has to build: its test suite is the same one the other two
  # platforms run, and the terminal is where they differ (plan, M9).
  build:
    name: build on windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release
